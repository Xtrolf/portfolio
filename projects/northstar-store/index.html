<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Responsive product catalogue demo with search, filters, sorting and cart."><title>Northstar — Store Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#1d2722;background:#f7f8f6;--green:#155b42;--line:#e2e7e2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 20px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0 20px}.logo{font-size:23px;font-weight:850;letter-spacing:-1px}.cart{background:#155b42;color:white;border-radius:30px;padding:10px 15px;font-weight:700}.hero{padding:46px 0 26px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-2px;margin:0 0 10px}.muted{color:#69776e}.tools{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin:20px 0}.tools input,.tools select{padding:12px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.art{height:150px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#e8f0e9,#f3eee4)}.info{padding:15px}.category{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6d7c72}.name{font-weight:750;margin:5px 0}.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.price{font-weight:800}.add{background:#155b42;color:white;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:40px;color:#718078}.notice{font-size:12px;color:#718078;margin:24px 0}.cartbox{position:fixed;right:20px;bottom:20px;background:#1c2a22;color:white;border-radius:14px;padding:15px 18px;box-shadow:0 10px 30px #0002;display:none;max-width:calc(100% - 40px)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}@media(max-width:460px){.grid{grid-template-columns:1fr}.art{height:120px}}
</style></head><body><main class="wrap"><header class="nav"><div class="logo">northstar<span style="color:#155b42">.</span></div><div class="cart">Cart <span id="count">0</span></div></header><section class="hero"><p class="category">Everyday essentials</p><h1>Good things.<br>Thoughtfully chosen.</h1><p class="muted">A front-end store demo with working search, category filters, sorting and cart interactions.</p></section><section class="tools"><input id="search" placeholder="Search products…" aria-label="Search products"><select id="category"><option value="all">All categories</option><option>Workspace</option><option>Audio</option><option>Accessories</option></select><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></section><section class="grid" id="products"></section><p class="notice">Demo store only. Prices and products are sample data; checkout and payments are not implemented.</p></main><aside class="cartbox" id="cartbox" aria-live="polite"></aside><script>
const products=[{id:1,name:'Desk organiser',cat:'Workspace',price:499,icon:'🗂️'},{id:2,name:'Wireless headphones',cat:'Audio',price:1899,icon:'🎧'},{id:3,name:'Ceramic desk mug',cat:'Workspace',price:349,icon:'☕'},{id:4,name:'USB-C hub',cat:'Accessories',price:999,icon:'🔌'},{id:5,name:'Bluetooth speaker',cat:'Audio',price:1499,icon:'🔊'},{id:6,name:'Notebook set',cat:'Accessories',price:299,icon:'📓'}];let cart=[];const $=s=>document.querySelector(s);const money=n=>'₹'+n.toLocaleString('en-IN');
function render(){let list=products.filter(p=>(($('#search').value||'').toLowerCase().split(' ').every(w=>(p.name+' '+p.cat).toLowerCase().includes(w)))&&($('#category').value==='all'||p.cat===$('#category').value));if($('#sort').value==='low')list.sort((a,b)=>a.price-b.price);if($('#sort').value==='high')list.sort((a,b)=>b.price-a.price);$('#products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="art">${p.icon}</div><div class="info"><div class="category">${p.cat}</div><div class="name">${p.name}</div><div class="row"><span class="price">${money(p.price)}</span><button class="add" data-id="${p.id}">Add to cart</button></div></div></article>`).join(''):'<div class="empty">No products match your search.</div>'}
$('#products').addEventListener('click',e=>{let id=Number(e.target.dataset.id);if(!id)return;cart.push(products.find(p=>p.id===id));$('#count').textContent=cart.length;let total=cart.reduce((s,p)=>s+p.price,0);$('#cartbox').style.display='block';$('#cartbox').textContent=cart.length+' item(s) in cart · '+money(total)});
['search','category','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
