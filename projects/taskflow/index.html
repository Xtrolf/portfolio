<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A lightweight task board built with HTML, CSS and vanilla JavaScript."><title>TaskFlow — Task Board</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17221d;background:#f4f7f4;--green:#176b4a;--line:#dce5df}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:800}.tag{color:#557063;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:22px;box-shadow:0 8px 30px #183b2410}.form{display:grid;grid-template-columns:1fr 150px auto;gap:10px}input,select,button{font:inherit;border-radius:9px;padding:11px 12px;border:1px solid var(--line)}button{background:var(--green);color:white;border:0;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.filters button{background:#edf4ef;color:#315344}.filters button.active{background:var(--green);color:white}.stats{display:flex;gap:18px;color:#557063;font-size:13px;margin:16px 0}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:12px;border-radius:10px}.task.done .name{text-decoration:line-through;color:#8a9b91}.name{flex:1;overflow-wrap:anywhere}.priority{font-size:11px;background:#f1f4f2;padding:4px 8px;border-radius:20px}.delete{background:#fff0ed;color:#a13b2c;padding:7px 10px}.empty{text-align:center;color:#809087;padding:30px}.foot{font-size:12px;color:#718279;text-align:center;margin:24px}
@media(max-width:600px){.form{grid-template-columns:1fr 1fr}.form input{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}.task{gap:8px}.priority{display:none}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">TaskFlow <span style="color:#176b4a">/</span></div><div class="tag">A simple task board · HTML, CSS & JavaScript</div></div><div class="tag">Saved in this browser</div></header><section class="panel"><h1 style="margin:0 0 6px;font-size:25px">My tasks</h1><p class="tag" style="margin:0 0 18px">Add work, track progress, and keep the list organised.</p><form class="form" id="taskForm"><input id="taskInput" placeholder="What needs to get done?" maxlength="100" required><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><button>Add task</button></form><div class="filters" id="filters"><button type="button" class="active" data-filter="all">All</button><button type="button" data-filter="open">Active</button><button type="button" data-filter="done">Completed</button></div><div class="stats" id="stats"></div><div class="tasks" id="tasks"></div></section><div class="foot">TaskFlow demo · Data stays in localStorage on this device.</div></main><script>
const KEY='taskflow-items-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function render(){let shown=items.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));$('#stats').textContent=items.filter(t=>!t.done).length+' active · '+items.filter(t=>t.done).length+' completed · '+items.length+' total';$('#tasks').innerHTML=shown.length?shown.map(t=>`<div class="task ${t.done?'done':''}" data-id="${t.id}"><input aria-label="Mark complete" type="checkbox" ${t.done?'checked':''} data-action="toggle"><span class="name">${escapeHtml(t.name)}</span><span class="priority">${t.priority}</span><button class="delete" data-action="delete" aria-label="Delete task">Delete</button></div>`).join(''):'<div class="empty">Nothing here yet. Add a task above.</div>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#taskForm').addEventListener('submit',e=>{e.preventDefault();let name=$('#taskInput').value.trim();if(!name)return;items.unshift({id:crypto.randomUUID(),name,priority:$('#priority').value,done:false});$('#taskInput').value='';save()});
$('#tasks').addEventListener('change',e=>{if(e.target.dataset.action==='toggle'){let t=items.find(x=>x.id===e.target.closest('.task').dataset.id);t.done=e.target.checked;save()}});
$('#tasks').addEventListener('click',e=>{if(e.target.dataset.action==='delete'){items=items.filter(t=>t.id!==e.target.closest('.task').dataset.id);save()}});
$('#filters').addEventListener('click',e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;$('#filters').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()}});
render();
</script></body></html>
